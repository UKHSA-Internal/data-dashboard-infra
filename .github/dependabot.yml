version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/terraform/10-account"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/20-app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # group all minor/patch updates across every lambda into a single PR; major updates are grouped into a separate PR
  # so risky upgrades can be reviewed on their own
  - package-ecosystem: "npm"
    directories:
      - "/src/lambda-alarm-notification"
      - "/src/lambda-api-gateway"
      - "/src/lambda-db-password-rotation"
      - "/src/lambda-front-end-revalidation"
      - "/src/lambda-producer-handler"
      - "/src/lambda-retrieve-user-permission-set"
      - "/src/legacy-dashboard-redirect-viewer-request"
      - "/src/public-api-cloud-front-viewer-request"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
